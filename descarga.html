<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargar Imagen</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 350px;
            width: 100%;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            background-color: #2ea44f;
            color: white;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #2c974b;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Tu imagen está lista</h2>
        <!-- Vista previa opcional de la imagen -->
        <img src="https://raw.githubusercontent.com/TU-USUARIO/TU-REPO/main/TU-IMAGEN.jpg" alt="Vista previa">
        
        <!-- Enlace directo con el atributo download -->
        <a href="https://raw.githubusercontent.com/TU-USUARIO/TU-REPO/main/TU-IMAGEN.jpg" class="btn" download="mi-foto.jpg">
            Descargar Imagen
        </a>
    </div>

</body>
</html>
